<!doctype html>
<!-- @dsCard group="Components" name="Component · Buttons" subtitle="Primary · Ghost · Gradient · Disabled" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:22px 28px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:4px;font-family:var(--qx-font-body);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;border:1px solid transparent;transition:transform .15s ease, background .2s ease, color .2s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:#00FFEF;color:#2C2C2C;}
.btn-primary:hover{background:#EAFF00;}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.18);}
.btn-ghost:hover{border-color:#00FFEF;color:#00FFEF;}
.btn-grad{background:linear-gradient(90deg,#00FFEF,#EAFF00);color:#2C2C2C;}
.btn-disabled{background:#3A3A3A;color:#888;cursor:not-allowed;}
.btn-disabled:hover{transform:none;}
.lab{font-family:var(--qx-font-mono);font-size:10px;color:#888;letter-spacing:.16em;text-transform:uppercase;}
</style></head><body><div class="card">
  <div class="lab">Buttons</div>
  <div class="row">
    <button class="btn btn-primary">Hablemos</button>
    <button class="btn btn-ghost">Ver casos</button>
    <button class="btn btn-grad">Empieza ahora</button>
    <button class="btn btn-disabled">Disabled</button>
  </div>
</div></body></html>
