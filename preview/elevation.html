<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Elevation" subtitle="shadow-1 subtle · shadow-2 elevated · shadow-cyan focus" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:24px 28px;display:flex;gap:18px;align-items:center;justify-content:space-around;}
.box{width:130px;height:80px;background:#2C2C2C;border:1px solid rgba(255,255,255,.12);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--qx-font-mono);font-size:11px;color:#888;gap:4px;}
.box b{color:#fff;font-weight:500;}
.s1{box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.4);}
.s2{box-shadow:0 8px 24px rgba(0,0,0,.45);}
.s3{box-shadow:0 0 0 3px rgba(0,255,239,.25);}
</style></head><body><div class="card">
  <div class="box s1"><b>--shadow-1</b><span>subtle</span></div>
  <div class="box s2"><b>--shadow-2</b><span>elevated</span></div>
  <div class="box s3"><b>--shadow-cyan</b><span>focus ring</span></div>
</div></body></html>
