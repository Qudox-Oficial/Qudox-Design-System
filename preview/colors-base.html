<!doctype html>
<!-- @dsCard group="Colors" name="Color · Base palette" subtitle="5 brand colors — cyan, yellow, dark, dark-soft, light" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
.row{display:flex;gap:10px;align-items:stretch;}
.sw{flex:1;border-radius:6px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-height:96px;border:1px solid var(--qx-line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;}
.sw .hex{font-family:var(--qx-font-mono);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px;opacity:.85;}
</style></head><body><div class="card">
  <div class="row">
    <div class="sw" style="background:#00FFEF;color:#2C2C2C;">CYAN<span class="hex">#00FFEF</span></div>
    <div class="sw" style="background:#EAFF00;color:#2C2C2C;">YELLOW<span class="hex">#EAFF00</span></div>
    <div class="sw" style="background:#2C2C2C;color:#fff;">DARK<span class="hex">#2C2C2C</span></div>
    <div class="sw" style="background:#5A5A5A;color:#fff;">DARK&nbsp;SOFT<span class="hex">#5A5A5A</span></div>
    <div class="sw" style="background:#F1F0EA;color:#2C2C2C;">LIGHT<span class="hex">#F1F0EA</span></div>
  </div>
</div></body></html>
