<!doctype html>
<!-- @dsCard group="Colors" name="Color · Gradients" subtitle="Primary cyan→yellow + background dark→dark-soft" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:14px;align-items:center;background:#161616;border:1px solid var(--qx-line);border-radius:8px;padding:12px;}
.bar{flex:0 0 240px;height:48px;border-radius:4px;}
.meta{font-size:11px;color:#C8C8C8;line-height:1.6;}
.meta strong{display:block;color:#fff;letter-spacing:.18em;font-weight:700;font-size:12px;margin-bottom:2px;}
</style></head><body><div class="card">
  <div class="row">
    <div class="bar" style="background:linear-gradient(90deg,#00FFEF 0%,#EAFF00 100%);"></div>
    <div class="meta"><strong>PRIMARY GRADIENT</strong>linear-gradient(90deg, #00FFEF 0%, #EAFF00 100%)<br>Card top stripe · gradient buttons · pattern stroke</div>
  </div>
  <div class="row">
    <div class="bar" style="background:linear-gradient(90deg,#2C2C2C 0%,#5A5A5A 100%);"></div>
    <div class="meta"><strong>BACKGROUND GRADIENT</strong>linear-gradient(90deg, #2C2C2C 0%, #5A5A5A 100%)<br>Hero washes · large surface fills</div>
  </div>
</div></body></html>
