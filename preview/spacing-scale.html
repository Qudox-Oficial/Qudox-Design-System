<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 4pt scale" subtitle="9-step scale: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:24px 28px;}
.row{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box{background:#00FFEF;width:100%;border-radius:2px;}
.lbl{font-family:var(--qx-font-mono);font-size:10px;color:#888;}
.val{font-family:var(--qx-font-mono);font-size:10px;color:#fff;}
</style></head><body><div class="card">
  <div class="row">
    <div class="cell"><div class="box" style="height:4px;"></div><span class="val">4</span><span class="lbl">--qx-space-1</span></div>
    <div class="cell"><div class="box" style="height:8px;"></div><span class="val">8</span><span class="lbl">space-2</span></div>
    <div class="cell"><div class="box" style="height:12px;"></div><span class="val">12</span><span class="lbl">space-3</span></div>
    <div class="cell"><div class="box" style="height:16px;"></div><span class="val">16</span><span class="lbl">space-4</span></div>
    <div class="cell"><div class="box" style="height:24px;"></div><span class="val">24</span><span class="lbl">space-5</span></div>
    <div class="cell"><div class="box" style="height:32px;"></div><span class="val">32</span><span class="lbl">space-6</span></div>
    <div class="cell"><div class="box" style="height:48px;"></div><span class="val">48</span><span class="lbl">space-7</span></div>
    <div class="cell"><div class="box" style="height:64px;"></div><span class="val">64</span><span class="lbl">space-8</span></div>
    <div class="cell"><div class="box" style="height:96px;"></div><span class="val">96</span><span class="lbl">space-9</span></div>
  </div>
</div></body></html>
