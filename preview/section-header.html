<!doctype html>
<!-- @dsCard group="Type" name="Type · Section header pattern" subtitle="label · ────── · UPPERCASE — the brand's signature header" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
