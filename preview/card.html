<!doctype html>
<!-- @dsCard group="Components" name="Component · Card" subtitle="Tag + display title + body, with gradient top stripe" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.wrap{padding:22px 28px;}
.card{background:#2C2C2C;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:24px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,#00FFEF,#EAFF00);}
.card .tag{display:inline-block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#00FFEF;margin-bottom:10px;font-weight:700;}
.card h3{font-family:var(--qx-font-display);font-style:italic;font-size:28px;font-weight:400;color:#fff;margin:0 0 8px;}
.card p{color:#C8C8C8;font-size:14px;margin:0;line-height:1.5;}
</style></head><body><div class="wrap"><div class="card">
  <span class="tag">Growth</span>
  <h3>Marketing que escala</h3>
  <p>Estrategias data-driven para hacer crecer marcas con consistencia y velocidad.</p>
</div></div></body></html>
