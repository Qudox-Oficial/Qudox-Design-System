<!doctype html>
<!-- @dsCard group="Colors" name="Color · Semantic states" subtitle="Success, atención, neutro, focus — pill treatment" viewport="700x140" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:20px 28px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.pill{padding:8px 14px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
.note{font-size:11px;color:#888;font-family:var(--qx-font-mono);}
</style></head><body><div class="card">
  <div class="row">
    <span class="pill" style="background:#00FFEF;color:#2C2C2C;">SUCCESS</span>
    <span class="pill" style="background:#EAFF00;color:#2C2C2C;">ATENCIÓN</span>
    <span class="pill" style="background:#2C2C2C;color:#fff;border:1px solid rgba(255,255,255,.12);">NEUTRO</span>
    <span class="pill" style="background:transparent;color:#00FFEF;border:1px solid #00FFEF;">FOCUS</span>
  </div>
  <div class="note">Status uses the same accents as the rest of the system. Bold + uppercase + 0.18em tracking is the rule for state pills.</div>
</div></body></html>
