<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Logo lockups" subtitle="Wordmark + tagline on light + dark" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:22px 28px;display:flex;flex-direction:column;gap:12px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.lockup{border-radius:8px;padding:38px 28px;display:flex;align-items:center;justify-content:center;min-height:140px;}
.lockup.light{background:#F1F0EA;}
.lockup.dark{background:#2C2C2C;border:1px solid rgba(255,255,255,.12);}
.lockup img{max-width:88%;height:auto;display:block;}
.cap{font-family:var(--qx-font-mono);font-size:11px;color:#888;display:flex;justify-content:space-between;}
.cap b{color:#fff;font-weight:500;}
</style></head><body><div class="card">
  <div class="row">
    <div class="lockup light"><img src="../assets/logo-qudox-dark.png" alt="Qudox · Growth Marketing Company (dark)"></div>
    <div class="lockup dark"><img src="../assets/logo-qudox-light.png" alt="Qudox · Growth Marketing Company (light)"></div>
  </div>
  <div class="cap"><span><b>logo-qudox-dark.png</b> &middot; light surfaces</span><span><b>logo-qudox-light.png</b> &middot; dark surfaces</span></div>
</div></body></html>
