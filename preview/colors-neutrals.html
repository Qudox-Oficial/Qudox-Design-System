<!doctype html>
<!-- @dsCard group="Colors" name="Color · Neutral scale" subtitle="fg-1 through fg-5 + bg-2/bg-3 surface tokens" viewport="700x320" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:var(--qx-bg-2);color:var(--qx-fg-1);font-family:var(--qx-font-body);}
.card{padding:24px 28px;display:flex;flex-direction:column;gap:10px;}
.r{display:grid;grid-template-columns:120px 1fr 110px;gap:14px;align-items:center;font-size:13px;}
.chip{height:32px;border-radius:4px;border:1px solid var(--qx-line);}
.tok{font-family:var(--qx-font-mono);font-size:12px;color:#C8C8C8;}
.hex{font-family:var(--qx-font-mono);font-size:12px;color:#fff;text-align:right;}
</style></head><body><div class="card">
  <div class="r"><div class="chip" style="background:#FFFFFF"></div><span class="tok">--qx-fg-1</span><span class="hex">#FFFFFF</span></div>
  <div class="r"><div class="chip" style="background:#EDEDED"></div><span class="tok">--qx-fg-2</span><span class="hex">#EDEDED</span></div>
  <div class="r"><div class="chip" style="background:#C8C8C8"></div><span class="tok">--qx-fg-3</span><span class="hex">#C8C8C8</span></div>
  <div class="r"><div class="chip" style="background:#B5B5B5"></div><span class="tok">--qx-fg-4</span><span class="hex">#B5B5B5</span></div>
  <div class="r"><div class="chip" style="background:#888"></div><span class="tok">--qx-fg-5</span><span class="hex">#888888</span></div>
  <div class="r"><div class="chip" style="background:#1E1E1E"></div><span class="tok">--qx-bg-2</span><span class="hex">#1E1E1E</span></div>
  <div class="r"><div class="chip" style="background:#161616"></div><span class="tok">--qx-bg-3</span><span class="hex">#161616</span></div>
</div></body></html>
